project_id = "kin"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback", "dev.ashuujha.kin://auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false
jwt_expiry = 3600
signing_keys_path = "./signing-keys.local.json"
jwt_secret = "env(KIN_LOCAL_JWT_SECRET)"
anon_key = "env(KIN_LOCAL_ANON_KEY)"
service_role_key = "env(KIN_LOCAL_SERVICE_KEY)"

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[storage]
enabled = true
file_size_limit = "5MiB"

[functions.extract-prescription]
# The function verifies the JWT with auth.getUser before touching records.
# This supports modern Supabase signing keys as well as legacy local JWTs.
verify_jwt = false

[functions.emergency-contact]
verify_jwt = false
