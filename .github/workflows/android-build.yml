name: Android APK
on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
    inputs:
      supabase_url:
        description: 'Optional public API URL (local debug testing may use a LAN URL)'
        type: string
      supabase_public_key:
        description: 'Public anon/publishable key only; never a service key'
        type: string
      receiver_url:
        description: 'Optional receiver URL'
        type: string
      local_test_login:
        description: 'Enable labelled local password login in this debug APK'
        type: boolean
        default: false
      build_mode:
        description: 'Release is smaller and uses the persistent distribution certificate'
        type: choice
        options: [release, debug]
        default: release
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Configure persistent release signing
        if: inputs.build_mode != 'debug'
        env:
          KIN_KEYSTORE: ${{ secrets.KIN_ANDROID_KEYSTORE_BASE64 }}
          KIN_SIGNING_PASSWORD: ${{ secrets.KIN_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('KIN_KEYSTORE', '')
          password = os.environ.get('KIN_SIGNING_PASSWORD', '')
          if not encoded or not password or any(c in password for c in '\r\n'):
              raise SystemExit('Persistent Android signing secrets are missing or invalid.')
          key = Path('android/kin-signing.p12')
          key.write_bytes(base64.b64decode(encoded, validate=True))
          key.chmod(0o600)
          props = Path('android/key.properties')
          props.write_text(f'storeFile=kin-signing.p12\nstorePassword={password}\nkeyAlias=kin\nkeyPassword={password}\n')
          props.chmod(0o600)
          PY
      - name: Build installable APK
        env:
          KIN_DB_URL: ${{ inputs.supabase_url || vars.SUPABASE_URL }}
          KIN_PUBLIC_KEY: ${{ inputs.supabase_public_key || vars.SUPABASE_ANON_KEY }}
          KIN_RECEIVER_URL: ${{ inputs.receiver_url || vars.RECIPIENT_URL }}
          KIN_LOCAL_AUTH: ${{ inputs.local_test_login && 'true' || 'false' }}
          KIN_BUILD_MODE: ${{ inputs.build_mode || 'release' }}
        run: >-
          flutter build apk --${KIN_BUILD_MODE} --split-per-abi
          --dart-define=SUPABASE_URL="$KIN_DB_URL"
          --dart-define=SUPABASE_ANON_KEY="$KIN_PUBLIC_KEY"
          --dart-define=RECIPIENT_URL="$KIN_RECEIVER_URL"
          --dart-define=ALLOW_LOCAL_AUTH="$KIN_LOCAL_AUTH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kin-android-${{ inputs.build_mode || 'release' }}
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 7
