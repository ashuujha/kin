name: Android APK
on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
    inputs:
      supabase_url:
        description: 'Optional public API URL (local debug testing may use a LAN URL)'
        type: string
      supabase_public_key:
        description: 'Public anon/publishable key only; never a service key'
        type: string
      receiver_url:
        description: 'Optional receiver URL'
        type: string
      local_test_login:
        description: 'Enable labelled local password login in this debug APK'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build installable debug APK
        env:
          KIN_DB_URL: ${{ inputs.supabase_url || vars.SUPABASE_URL }}
          KIN_PUBLIC_KEY: ${{ inputs.supabase_public_key || vars.SUPABASE_ANON_KEY }}
          KIN_RECEIVER_URL: ${{ inputs.receiver_url || vars.RECIPIENT_URL }}
          KIN_LOCAL_AUTH: ${{ inputs.local_test_login && 'true' || 'false' }}
        run: >-
          flutter build apk --debug --split-per-abi
          --dart-define=SUPABASE_URL="$KIN_DB_URL"
          --dart-define=SUPABASE_ANON_KEY="$KIN_PUBLIC_KEY"
          --dart-define=RECIPIENT_URL="$KIN_RECEIVER_URL"
          --dart-define=ALLOW_LOCAL_AUTH="$KIN_LOCAL_AUTH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kin-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/*-debug.apk
          retention-days: 7
