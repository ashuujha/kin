services:
  - type: web
    name: kin-receiver
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: apps/recipient-web/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GOOGLE_ENABLED
        value: "true"
      - key: VITE_SUPABASE_PROXY
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
